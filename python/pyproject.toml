[project]
name = "motionlandmarker"
version = "0.1.0"
description = "MediaPipe による上半身ランドマークのリアルタイム可視化・録画（Python 単体版，macOS / Windows）"
# mediapipe は Swift 版のサイドカーと同じ 0.10 系に固定する（Mac と Windows で数値を揃えるため）．
# 0.10 系の wheel は Python 3.12 まで．
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "pyqtgraph>=0.13",
    "numpy",
    # opencv-python（非 headless）は独自の Qt を同梱して PySide6 と衝突するため headless を使う
    "opencv-python-headless",
    "mediapipe<1",
]

[project.optional-dependencies]
# 複数人モード（YOLO）．Ultralytics は AGPL-3.0，PyTorch 込みで約 1 GB
multi = ["ultralytics", "lap"]

[project.scripts]
motionlandmarker = "motionlandmarker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionlandmarker"]
