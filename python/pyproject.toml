[project]
name = "motionlandmarker"
version = "0.1.0"
description = "MediaPipe による上半身ランドマークのリアルタイム可視化・録画（Python 単体版，macOS / Windows）"
# mediapipe は Swift 版のサイドカーと同じ 0.10 系に固定する（Mac と Windows で数値を揃えるため）．
# 0.10 系の wheel は Python 3.12 まで．
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "pyqtgraph>=0.13",
    "numpy",
    # OpenCV は 1 系統だけ入れる．mediapipe が要求する opencv-contrib-python（非 headless）は
    # 独自の Qt を同梱して PySide6 と衝突し，別の cv2 と同時に入ると Windows で DLL が競合して
    # 「Unknown C++ exception from OpenCV code」になる．下の override で mediapipe 側の要求を無効化し，
    # headless の contrib（4.x 系）だけを使う．
    "opencv-contrib-python-headless>=4.10,<5",
    "mediapipe<1",
]

[tool.uv]
# mediapipe の opencv-contrib-python への依存を無効化する（常に偽のマーカーに置き換える）
override-dependencies = [
    "opencv-contrib-python; sys_platform == 'never'",
]

[project.optional-dependencies]
# 複数人モード（YOLO）．Ultralytics は AGPL-3.0，PyTorch 込みで約 1 GB
multi = ["ultralytics", "lap"]

[project.scripts]
motionlandmarker = "motionlandmarker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionlandmarker"]
